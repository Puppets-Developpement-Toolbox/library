bg_primary: boolean
title:
  _type: text
  _label: Titre
  _help: Encadrer du texte entre &lt; et &gt; pour le mettre en forme, par exemple &lt; mon texte en italique &gt;. Pour faire des sauts de ligne faire shift+entrer.
description: wysiwyg
cta: !load components/cta
cards:
  _type: repeater
  _repeat:
    picto:
      _label: picto
      _type: select
      _choices:
        puzzle: puzzle
        handshake: handshake
        speech: speech
        idea: idea
        broadcast: broadcast
        key: key
    link:
      _label: Lien
      _type: url
      _help: Lien de la page sans l'ancre.
    ancre:
      _label: Ancre
      _type: text_short
      _help: Identifiant de l'ancre. Par exemple "mon_identifiant". Le \# est automatique
    content: wysiwyg
